<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background with subtle safe-zone margin -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Stylized App Icon inside safe zone (central 80%) -->
  <g filter="url(#shadow)" transform="translate(106, 106) scale(0.5859375)">
    <!-- Package Box outline -->
    <path d="M256 64 L448 160 L256 256 L64 160 Z" fill="#93c5fd" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
    <path d="M64 160 L64 352 L256 448 L256 256 Z" fill="#3b82f6" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
    <path d="M256 256 L256 448 L448 352 L448 160 Z" fill="#1d4ed8" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" />
    <!-- Tape detail -->
    <path d="M192 128 L320 192" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <path d="M256 256 L256 360" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
